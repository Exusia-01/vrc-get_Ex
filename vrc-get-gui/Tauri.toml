# ALCOM-Ex: product name and identifier are changed from stock ALCOM so that
# ALCOM-Ex can be installed side-by-side with stock ALCOM and never replaces it.
productName = "ALCOM-Ex"
identifier = "com.anatawa12.vrc-get-gui.ex"

[build]
beforeBuildCommand = "npm run build"
beforeDevCommand = "npm run dev"
devUrl = "http://localhost:3030"
frontendDist = "out"
